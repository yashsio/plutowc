name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build and test
        run: nix build .# -L

      - name: Build XWayland package
        run: nix build .#pluto-xwayland -L

      - name: Flake checks
        run: nix flake check -L

      - name: Build with warnings as errors
        run: |
          nix develop -c make clean
          nix develop -c make CFLAGS=-Werror
          nix develop -c make test

      - name: Headless smoke test
        run: nix develop -c tests/smoke.sh

      - name: Build with XWayland support
        run: |
          nix develop -c make clean
          nix develop -c make XWAYLAND=-DXWAYLAND XLIBS="xcb xcb-icccm" CFLAGS=-Werror
          nix develop -c make test

      - name: XWayland smoke test
        run: nix develop -c tests/smoke.sh --xwayland

      - name: Install and dist checks
        run: |
          nix develop -c make dist
          tar -tzf pluto-*.tar.gz | grep -q 'start.sh'
          tar -tzf pluto-*.tar.gz | grep -q 'flake.lock'
          dest=$(mktemp -d)
          nix develop -c make install DESTDIR="$dest"
          test -x "$dest/usr/local/bin/pluto"
          test -f "$dest/usr/local/share/pluto/start.sh"
