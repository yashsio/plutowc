name: Bug Report
about: Something in Pluto isn't working correctly
title:
labels:
    - 'Kind/Bug'
body:
    - type: markdown
      attributes:
          value: |
              - Only report bugs that can be reproduced on the pluto branch without patches.
              - Proprietary graphics drivers, including nvidia, are not supported. Please use the open source equivalents, such as nouveau, if you would like to use Pluto.
              - Report patch issues to their respective authors.

    - type: input
      id: pluto_version
      attributes:
          label: 'Pluto version:'
          placeholder: '`pluto -v`'
      validations:
          required: true

    - type: input
      id: wlroots_version
      attributes:
          label: 'wlroots version:'
      validations:
          required: true

    - type: input
      id: distro
      attributes:
          label: What distro (and version) are you using?
      validations:
          required: false

    - type: textarea
      attributes:
          label: Description
          value: |
              The steps you took to reproduce the problem.
      validations:
          required: false

    - type: textarea
      id: debug_log
      attributes:
          label: Debug Log
          value: |
              Run `pluto -d 2> ~/pluto.log` from a TTY and attach the **full** (do not truncate it) file here, or upload it to a pastebin.
              Please try to keep the reproduction as brief as possible and exit Pluto.
      validations:
          required: false

    - type: textarea
      id: backtrace
      attributes:
          label: Stack Trace
          value: |
              - Only required if Pluto crashes.
              - If the lines mentioning Pluto or wlroots have `??`. Please compile both Pluto and wlroots from source (enabling debug symbols) and try to reproduce.
      validations:
          required: false
